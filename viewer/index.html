<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Walk through a 3D model of the SSMC 4th-floor ICU in your browser.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>SSMC ICU Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; floating toolbar (top left), object list (right), minimap (bottom right),
     info card (bottom left). The site's calm clinical palette: teal accent on cool neutrals, confidence in status dots. */
  :root {
    --bg: #e4eef0; --panel: rgba(249, 252, 253, 0.93); --ink: #14262d; --muted: #465d66; --line: #d2e0e4; --track: #728a94;
    --accent: #0b6d75; --accent-ink: #ffffff; --hover: rgba(11, 109, 117, 0.10); --current: rgba(11, 109, 117, 0.18);
    --hi: #1a8a7e; --med: #a9750a; --low: #b4422c; --tip-bg: rgba(16, 34, 41, 0.9); --tip-ink: #ffffff;
    --shadow: 0 8px 28px rgba(16, 44, 54, 0.14);
    --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --g: 12px;
    /* Motion, shared with the site: entrances ease out, exits ease in and run quicker, interface moves spring with one slight overshoot. */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --spring: cubic-bezier(0.3, 1.65, 0.55, 1);
    --t-press: 110ms; --t-spring: 340ms; --t-enter: 220ms; --t-exit: 130ms; --t-enter-s: 130ms; --t-exit-s: 80ms;
    --t-sheet-in: 320ms; --t-sheet-out: 200ms; --t-reveal: 600ms;
    --press: 0.96; --press-row: 0.985; --press-pad: 0.9; --pop: 0.88; --squish: 1.2; --hop: -1.5px; --rise: 8px; --rise-s: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    :root {
      --spring: var(--ease-out);
      --t-press: 80ms; --t-spring: 120ms; --t-enter: 120ms; --t-exit: 80ms; --t-enter-s: 100ms; --t-exit-s: 60ms;
      --t-sheet-in: 120ms; --t-sheet-out: 80ms; --t-reveal: 160ms;
      --press: 1; --press-row: 1; --press-pad: 1; --pop: 1; --squish: 1; --hop: 0px; --rise: 0px; --rise-s: 0px;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111c20; --panel: rgba(23, 36, 41, 0.93); --ink: #e6f0f2; --muted: #9fb4bc; --line: #2f444c; --track: #6a838e;
      --accent: #4dbcc2; --accent-ink: #07191c; --hover: rgba(77, 188, 194, 0.12); --current: rgba(77, 188, 194, 0.22);
      --hi: #5dd6c4; --med: #e3b04b; --low: #e87d68;
      --tip-bg: rgba(236, 245, 246, 0.92); --tip-ink: #0f2026; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111c20; --panel: rgba(23, 36, 41, 0.93); --ink: #e6f0f2; --muted: #9fb4bc; --line: #2f444c; --track: #6a838e;
    --accent: #4dbcc2; --accent-ink: #07191c; --hover: rgba(77, 188, 194, 0.12); --current: rgba(77, 188, 194, 0.22);
    --hi: #5dd6c4; --med: #e3b04b; --low: #e87d68;
    --tip-bg: rgba(236, 245, 246, 0.92); --tip-ink: #0f2026; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; transition: opacity var(--t-reveal) var(--ease-out); }
  #c.pending { opacity: 0; transition: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #bar { position: fixed; top: calc(var(--g) + env(safe-area-inset-top, 0px)); left: calc(var(--g) + env(safe-area-inset-left, 0px));
    max-width: calc(100vw - 2 * var(--g) - 340px); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #bar h1 { font-size: 14px; margin: 0 6px 0 2px; font-weight: 600; white-space: nowrap; text-wrap: balance; }
  #bar .status { color: var(--muted); font-size: 12px; width: 100%; margin: 0 2px; }
  #bar .help { color: var(--muted); font-size: 12px; width: 100%; margin: 0 2px; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .v { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; }
  /* buttons and rows: hover fades a tint in, the pressed or current state springs a fill into place, a press scales down and springs back */
  .v, .row, #pad button { --t-move: var(--t-spring); --t-color: var(--t-exit); --e-color: var(--ease-in); position: relative; isolation: isolate; transition: transform var(--t-move) var(--spring), color var(--t-color) var(--e-color); }
  .v::before, .v::after, .row::before, .row::after, #pad button::after { content: ""; position: absolute; z-index: -1; border-radius: inherit; opacity: 0; pointer-events: none; }
  .v::before, .v::after, #pad button::after { inset: -1px; }
  .row::before, .row::after { inset: 0; }
  .v::before, .row::before { background: var(--hover); transition: opacity var(--t-exit) var(--ease-in); }
  .v::after, .row::after { transform: scale(var(--pop)); transition: opacity var(--t-exit) var(--ease-in), transform var(--t-spring) var(--spring); }
  .v::after { background: var(--accent); }
  .row::after, #pad button::after { background: var(--current); }
  #pad button::after { transition: opacity var(--t-exit) var(--ease-in); }
  @media (hover: hover) {
    .v:hover::before, .row:hover::before { opacity: 1; transition: opacity var(--t-enter) var(--ease-out); }
    button.v.person:hover svg { transform: translateY(var(--hop)); }
  }
  button.v[aria-pressed="true"], #toggleSide[aria-expanded="true"] { --t-color: var(--t-enter); --e-color: var(--ease-out); color: var(--accent-ink); }
  button.v[aria-pressed="true"]::after, #toggleSide[aria-expanded="true"]::after, .row[aria-current="true"]::after { opacity: 1; transform: none; transition: opacity var(--t-enter) var(--ease-out), transform var(--t-spring) var(--spring); }
  .v:active, .row:active, #pad button:active, #pad button.held { --t-move: var(--t-press); }
  .v:active { transform: scale(var(--press)); }
  .row:active { transform: scale(var(--press-row)); }
  #pad button:active, #pad button.held { transform: scale(var(--press-pad)); }
  #pad button:active::after, #pad button.held::after { opacity: 1; transition: opacity var(--t-enter) var(--ease-out); }
  button:focus-visible, a:focus-visible, .row:focus-visible, #c:focus-visible, #mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.sw { position: relative; display: inline-flex; gap: 8px; align-items: center; cursor: pointer; padding: 4px 6px; user-select: none; }
  #ceil { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .knob { --t-move: var(--t-spring); position: relative; flex: none; width: 30px; height: 18px; border-radius: 999px; background: var(--track); }
  .knob::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--accent); opacity: 0; transition: opacity var(--t-exit) var(--ease-in); }
  .knob::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-ink); transition: transform var(--t-move) var(--spring); }
  #ceil:checked + .knob::before { opacity: 1; transition: opacity var(--t-enter) var(--ease-out); }
  #ceil:checked + .knob::after { transform: translateX(12px); }
  label.sw:active .knob { --t-move: var(--t-press); }
  label.sw:active .knob::after { transform: scaleX(var(--squish)); }
  label.sw:active #ceil:checked + .knob::after { transform: translateX(12px) scaleX(var(--squish)); }
  #ceil:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }
  #side { position: fixed; top: calc(var(--g) + env(safe-area-inset-top, 0px)); right: calc(var(--g) + env(safe-area-inset-right, 0px));
    bottom: calc(var(--g) + 236px + env(safe-area-inset-bottom, 0px)); width: 318px; display: flex; flex-direction: column; overflow: hidden; }
  #side header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #side header h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.high { background: var(--hi); } .dot.med { background: var(--med); } .dot.low { background: var(--low); }
  #list { overflow-y: auto; padding: 6px 6px 12px; min-height: 0; }
  .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 10px 8px 4px; }
  .row { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; font: inherit; color: inherit;
    background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; }
  .row .tx { min-width: 0; display: flex; flex-direction: column; }
  .row .lb { font-size: 13px; }
  .row .id { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row[aria-current="true"] .id { color: var(--ink); }
  #mini { position: fixed; right: calc(var(--g) + env(safe-area-inset-right, 0px)); bottom: calc(var(--g) + env(safe-area-inset-bottom, 0px));
    width: 220px; height: 220px; padding: 0; cursor: crosshair; overflow: hidden; }
  #mini canvas { width: 100%; height: 100%; display: block; border-radius: 11px; }
  #mini .cap { position: absolute; left: 6px; top: 6px; padding: 1px 6px; border-radius: 6px; background: var(--panel); font-size: 11px; color: var(--muted); pointer-events: none; }
  #info { position: fixed; left: calc(var(--g) + env(safe-area-inset-left, 0px)); bottom: calc(var(--g) + env(safe-area-inset-bottom, 0px));
    padding: 12px 14px; width: min(440px, calc(100vw - 2 * var(--g) - 250px)); }
  #info h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #info .meta { color: var(--muted); font: 12px var(--mono); margin-bottom: 6px; }
  #info p { margin: 0; font-size: 13px; max-width: 65ch; }
  #tip { position: fixed; pointer-events: none; padding: 4px 8px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-ink);
    font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); z-index: 5; }
  #pad { position: fixed; left: calc(var(--g) + env(safe-area-inset-left, 0px)); bottom: calc(var(--g) + 8px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
  #pad button { font: 18px var(--ui); border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); touch-action: none; }
  #pad .up { grid-column: 2; grid-row: 1; } #pad .lt { grid-column: 1; grid-row: 2; } #pad .dn { grid-column: 2; grid-row: 2; } #pad .rt { grid-column: 3; grid-row: 2; }
  button.v.person { display: inline-flex; gap: 6px; align-items: center; touch-action: none; }
  button.v.person svg { flex: none; transition: transform var(--t-spring) var(--spring); }
  #ghost { position: fixed; pointer-events: none; z-index: 6; transform: translate(-50%, -92%); color: var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }
  body.placing #c { cursor: crosshair; }
  #help.warn { color: var(--low); }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  /* Elements toggled with hidden: display is held through the exit, so it plays in full, and a quick re-open just reverses it. */
  #info, #pad, #load { --t-in: var(--t-enter); --t-out: var(--t-exit); }
  #tip, #ghost { --t-in: var(--t-enter-s); --t-out: var(--t-exit-s); }
  #info, #pad, #load, #tip, #ghost { transition: opacity var(--t-in) var(--ease-out), transform var(--t-in) var(--ease-out), display var(--t-in) var(--ease-out) allow-discrete; }
  #info[hidden], #pad[hidden], #load[hidden], #tip[hidden], #ghost[hidden] { opacity: 0; pointer-events: none; transition: opacity var(--t-out) var(--ease-in), transform var(--t-out) var(--ease-in), display var(--t-out) var(--ease-in) allow-discrete; }
  #info[hidden], #pad[hidden] { transform: translateY(var(--rise-s)); }
  #ghost[hidden] { transform: translate(-50%, -92%) scale(var(--pop)); }
  #cam3 { transition: transform var(--t-move) var(--spring), color var(--t-color) var(--e-color), opacity var(--t-enter) var(--ease-out), display var(--t-enter) var(--ease-out) allow-discrete; }
  #cam3[hidden] { opacity: 0; pointer-events: none; transition: transform var(--t-move) var(--spring), color var(--t-color) var(--e-color), opacity var(--t-exit) var(--ease-in), display var(--t-exit) var(--ease-in) allow-discrete; }
  @starting-style {
    #info, #pad { opacity: 0; transform: translateY(var(--rise)); }
    #tip { opacity: 0; transform: translate(12px, calc(12px + var(--rise-s))); }
    #ghost { opacity: 0; transform: translate(-50%, -92%) scale(var(--pop)); }
    #cam3 { opacity: 0; }
  }
  #toggleSide { display: none; }
  @media (max-width: 820px) {
    #bar { max-width: calc(100vw - 2 * var(--g)); right: calc(var(--g) + env(safe-area-inset-right, 0px)); }
    #bar .help { display: none; }
    #side { top: auto; left: var(--g); right: var(--g); width: auto; height: 46vh; bottom: calc(var(--g) + env(safe-area-inset-bottom, 0px));
      transform: translateY(calc(100% + 24px)); transition: transform var(--t-sheet-out) var(--ease-in); z-index: 4; }
    #side.open { transform: none; transition: transform var(--t-sheet-in) var(--ease-out); }
    #toggleSide { display: inline-block; }
    #mini { width: 132px; height: 132px; top: calc(var(--g) + var(--bar-h, 150px) + 8px + env(safe-area-inset-top, 0px)); bottom: auto; }
    #info { width: calc(100vw - 2 * var(--g)); bottom: calc(var(--g) + env(safe-area-inset-bottom, 0px)); }
    body.walking #info { bottom: calc(var(--g) + 130px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .knob::after { transition: none; }
  }
  @media (prefers-reduced-motion: reduce) and (max-width: 820px) {
    /* the sheet fades in place of sliding: it moves only while it can't be seen */
    #side { opacity: 0; transition: opacity var(--t-sheet-out) var(--ease-in), transform 0s var(--ease-in) var(--t-sheet-out); }
    #side.open { opacity: 1; transition: opacity var(--t-sheet-in) var(--ease-out); }
  }
</style>
</head>
<body>


<canvas id="c" tabindex="0" aria-label="3D model of the SSMC 4th-floor ICU"></canvas>
<div id="load">Loading the ICU model…</div>
<div id="bar" class="card" role="toolbar" aria-label="View controls">
  <h1 id="title">SSMC ICU, 4th floor</h1>
  <a class="v" href="../">Overview</a>
  <button class="v" data-view="orbit" aria-pressed="true">Orbit</button>
  <button class="v" data-view="first" aria-pressed="false">First person</button>
  <button class="v" data-view="top" aria-pressed="false">Top</button>
  <button class="v person" id="drop" aria-pressed="false" title="Drag onto the floor, or click this and then click a spot"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.6" r="2.6" fill="currentColor"/><path d="M8.6 9.2c0-.9.7-1.6 1.6-1.6h3.6c.9 0 1.6.7 1.6 1.6l-.6 6.3h-1.3l-.5 7h-2l-.5-7H9.2z" fill="currentColor"/></svg>Place person</button>
  <button class="v" id="cam3" aria-pressed="false" hidden title="Switch between the person's eyes and a view from behind them (V)">View from behind</button>
  <label class="sw"><input type="checkbox" id="ceil"><span class="knob" aria-hidden="true"></span> Ceiling</label>
  <button class="v" id="toggleSide" aria-controls="side" aria-expanded="false">Objects</button>
  <div class="status" id="status"></div>
  <div class="help" id="help"></div>
</div>
<aside id="side" class="card" aria-label="Objects">
  <header>
    <h2>Rooms and objects</h2>
    <div class="legend"><span><span class="dot high"></span> high</span><span><span class="dot med"></span> medium</span><span><span class="dot low"></span> low confidence</span></div>
  </header>
  <div id="list"></div>
</aside>
<div id="mini" class="card" tabindex="0" role="img" aria-label="Floor plan minimap. Click a spot to go there."><canvas id="miniC" width="440" height="440"></canvas><span class="cap">Plan · click to go there</span></div>
<div id="info" class="card" aria-live="polite" hidden><h3 id="iTitle"></h3><div class="meta" id="iMeta"></div><p id="iNotes"></p></div>
<div id="tip" hidden></div>
<div id="ghost" hidden><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.6" r="2.6" fill="currentColor"/><path d="M8.6 9.2c0-.9.7-1.6 1.6-1.6h3.6c.9 0 1.6.7 1.6 1.6l-.6 6.3h-1.3l-.5 7h-2l-.5-7H9.2z" fill="currentColor"/></svg></div>
<div id="pad" hidden aria-label="Walk controls">
  <button class="up" data-k="f" aria-label="Walk forward">▲</button><button class="lt" data-k="tl" aria-label="Turn left">◀</button>
  <button class="dn" data-k="b" aria-label="Walk back">▼</button><button class="rt" data-k="tr" aria-label="Turn right">▶</button>
</div>

const meta = Object.fromEntries(OBJECTS.map(o => [o.id, o]));
const rules = OBJECTS.map(o => [new RegExp(o.match), o.id]);
const objIdFor = name => { for (const [re, id] of rules) if (re.test(name)) return id; return null; };
document.getElementById("status").textContent = VIEW.status;

// world (x east, y north, z up) <-> three (x, y up, -z north)
const W2T = (x, y, z = 0) => new THREE.Vector3(x, z, -y);

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
const css = () => getComputedStyle(document.documentElement);
const setBg = () => { scene.background = new THREE.Color(css().getPropertyValue("--bg").trim() || "#e4eef0"); };
setBg();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", setBg);
new MutationObserver(setBg).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9096, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-30, 40, 10);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 800);
camera.rotation.order = "YXZ";
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;

const meshes = [], groups = {}, colliders = [], ceilingParts = [];
let hovered = null, selected = null, mode = "orbit";
let fly = null, thirdPerson = false, dropPreview = null, placing = false;
const floorMeshes = [];

const bar = document.getElementById("bar");
const syncBarH = () => document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
new ResizeObserver(syncBarH).observe(bar);  // #cam3 stays in the bar until its exit has played
function resize() {
  const w = innerWidth, h = innerHeight;
  syncBarH();
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const collideRe = new RegExp(VIEW.collide);
const loader = new GLTFLoader();
const onModel = gltf => {
  canvas.classList.add("pending");
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  for (const top of root.children) {
    const id = objIdFor(top.name);
    top.traverse(n => {
      if (!n.isMesh) return;
      n.userData.objId = id;
      n.userData.top = top.name;
      n.material = n.material.clone();
      n.userData.baseEmissive = n.material.emissive ? n.material.emissive.clone() : null;
      n.userData.glass = (n.material.transmission || 0) > 0 || n.material.opacity < 0.99;
      meshes.push(n);
      if (id) (groups[id] ||= []).push(n);
      if (id === "ceiling") ceilingParts.push(n);
      if (collideRe.test(top.name)) colliders.push(n);
      if (/^floor_/.test(top.name)) floorMeshes.push(n);
    });
  }
  buildList();
  setView("orbit");
  document.getElementById("load").hidden = true;
  // fade in over the matching page background, once the first frame with the model has been drawn
  requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.remove("pending")));
  window.__viewerReady = true;
};
const onFail = err => {
  document.getElementById("load").textContent = "The model could not be loaded. Check your connection and reload the page.";
  window.__viewerErrors.push(String(err));
};
async function fetchModel() {
  // the website serves a gzipped .glb, unpacked here with a percentage while it downloads
  const res = await fetch(GLB_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const total = Number(res.headers.get("content-length")) || 0, el = document.getElementById("load");
  const reader = res.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) el.textContent = `Loading the ICU model… ${Math.min(99, Math.round(got / total * 100))}%`;
  }
  const blob = new Blob(chunks), head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  const gz = head[0] === 0x1f && head[1] === 0x8b;  // a host may already have decoded it
  return gz ? new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer() : blob.arrayBuffer();
}
if (GLB_B64) loader.parse(Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0)).buffer, "", onModel, onFail);
else fetchModel().then(buf => loader.parse(buf, "", onModel, onFail)).catch(onFail);

function setCeiling(on) {
  document.getElementById("ceil").checked = on;
  for (const n of ceilingParts) n.visible = on;
}
document.getElementById("ceil").addEventListener("change", e => setCeiling(e.target.checked));

// ---------------------------------------------------------------- views
const HELP = {
  orbit: "Drag to orbit · right-drag or two fingers to pan · scroll or pinch to zoom · click anything to name it · drag <b>Place person</b> onto the floor to walk from there, or click the person",
  first: "<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · drag or <kbd>←</kbd><kbd>→</kbd> to look · <kbd>V</kbd> view from behind · doors and glass fronts let you through, walls don't",
  top: "Drag to pan · scroll or pinch to zoom · click anything to name it · drag <b>Place person</b> onto the floor to walk from there",
};
let yaw = 0, pitch = 0;
const walkPos = W2T(...VIEW.first.eye);
function lookAtYawPitch(from, to) {
  const d = to.clone().sub(from);
  yaw = Math.atan2(-d.x, -d.z);
  pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
}
lookAtYawPitch(W2T(...VIEW.first.eye), W2T(...VIEW.first.look));
const walkStart = { pos: walkPos.clone(), yaw, pitch };

function setView(v, opts = {}) {
  const prev = mode;
  mode = v;
  if (v !== "first") fly = null;
  document.getElementById("cam3").hidden = v !== "first";
  document.body.classList.toggle("walking", v === "first");
  document.querySelectorAll("button[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  showHelp();
  document.getElementById("pad").hidden = !(v === "first" && matchMedia("(pointer: coarse)").matches);
  controls.enabled = v !== "first";
  camera.up.set(0, 1, 0);
  if (v === "first") {
    camera.fov = 68;
    setCeiling(true);
    if (opts.fly && !matchMedia("(prefers-reduced-motion: reduce)").matches) startFly(); else placeCamera();
    canvas.focus({ preventScroll: true });
  } else if (v === "top") {
    camera.fov = 40;
    const [cx, cy] = VIEW.top.center, s = VIEW.top.size;
    const d = s / (2 * Math.tan(THREE.MathUtils.degToRad(20))) * 1.05;
    camera.position.copy(W2T(cx, cy - 0.001, d));
    controls.target.copy(W2T(cx, cy, 0));
    setCeiling(false);
  } else if (prev === "first") {
    // back out of the person's eyes: orbit around where they stand
    camera.fov = 45;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    controls.target.set(walkPos.x, 1.0, walkPos.z);
    camera.position.copy(controls.target).addScaledVector(fwd, -6.5).add(new THREE.Vector3(0, 6, 0));
    setCeiling(false);
  } else {
    camera.fov = 45;
    camera.position.copy(W2T(...VIEW.orbit.eye));
    controls.target.copy(W2T(...VIEW.orbit.look));
    setCeiling(false);
  }
  camera.updateProjectionMatrix();
  if (v !== "first") controls.update();
  resize();
}
document.querySelectorAll("button[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
window.__view = v => { setView(v); return mode; };

// ---------------------------------------------------------------- walking
const keys = new Set();
const pad = { f: 0, b: 0, tl: 0, tr: 0 };
addEventListener("keydown", e => {
  if (e.code === "Escape" && placing) { setPlacing(false); return; }
  if (mode !== "first" || e.target.closest("input, button, [role=toolbar] *")) return;
  if (e.code === "KeyV" && !e.repeat) { setThird(!thirdPerson); return; }
  keys.add(e.code);
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
document.querySelectorAll("#pad button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { pad[k] = 1; b.classList.add("held"); b.setPointerCapture(e.pointerId); e.preventDefault(); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, () => { pad[k] = 0; b.classList.remove("held"); });
});
const ray = new THREE.Raycaster();
function blocked(from, dir, dist) {
  for (const h of VIEW.walk_heights) {
    ray.set(new THREE.Vector3(from.x, h, from.z), dir);
    ray.far = dist + VIEW.radius;
    if (ray.intersectObjects(colliders, false).length) return true;
  }
  return false;
}
function tryMove(m) {
  const len = m.length();
  if (len < 1e-6 || blocked(walkPos, m.clone().normalize(), len)) return false;
  walkPos.add(m);
  return true;
}
function placeCamera() {
  if (!thirdPerson) { camera.position.copy(walkPos); camera.rotation.set(pitch, yaw, 0); return; }
  // behind the shoulder, pulled in when a wall is in the way
  const back = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)), want = 2.4;
  ray.set(walkPos, back); ray.far = want + 0.3;
  const hit = ray.intersectObjects(colliders, false)[0];
  const dist = hit ? Math.max(0.35, hit.distance - 0.3) : want;
  camera.position.copy(walkPos).addScaledVector(back, dist);
  camera.position.y += 0.4;
  camera.rotation.set(pitch - 0.14, yaw, 0);
}
function startFly() {
  const save = thirdPerson;
  const p0 = camera.position.clone(), q0 = camera.quaternion.clone();
  placeCamera();
  fly = { p0, q0, p1: camera.position.clone(), q1: camera.quaternion.clone(), t0: performance.now(), s: 0 };
  camera.position.copy(p0); camera.quaternion.copy(q0);
  thirdPerson = save;
}
function insideWall(p) {
  ray.set(new THREE.Vector3(p.x, VIEW.ceiling + 1, p.z), new THREE.Vector3(0, -1, 0));
  ray.far = VIEW.ceiling + 1.05;
  return ray.intersectObjects(colliders, false).some(h => h.point.y > 0.2);
}
function stepWalk(dt) {
  const k = c => keys.has(c);
  const turn = (k("ArrowLeft") || pad.tl ? 1 : 0) - (k("ArrowRight") || pad.tr ? 1 : 0);
  yaw += turn * 1.6 * dt;
  const f = (k("KeyW") || k("ArrowUp") || pad.f ? 1 : 0) - (k("KeyS") || k("ArrowDown") || pad.b ? 1 : 0);
  const s = (k("KeyD") ? 1 : 0) - (k("KeyA") ? 1 : 0);
  if (f || s) {
    const speed = (k("ShiftLeft") || k("ShiftRight") ? 3.2 : 1.4) * dt;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const m = fwd.multiplyScalar(f).add(right.multiplyScalar(s)).normalize().multiplyScalar(speed);
    if (!tryMove(m)) { tryMove(new THREE.Vector3(m.x, 0, 0)) || tryMove(new THREE.Vector3(0, 0, m.z)); }
  }
  walkPos.y = VIEW.eye;
  placeCamera();
}

// ---------------------------------------------------------------- highlight, select, list
function paint() {
  for (const m of meshes) if (m.userData.baseEmissive) m.material.emissive.copy(m.userData.baseEmissive);
  const tint = (id, c) => (groups[id] || []).forEach(m => m.userData.baseEmissive && m.material.emissive.set(c));
  if (hovered && hovered !== selected) tint(hovered, 0x0a3a40);
  if (selected) tint(selected, 0x0b6d75);
}
const label = id => (meta[id] ? meta[id].label : id);
function select(id, frame) {
  selected = id;
  paint();
  document.querySelectorAll(".row").forEach(r => r.setAttribute("aria-current", String(r.dataset.id === id)));
  const card = document.getElementById("info");
  if (!id) { card.hidden = true; return; }
  const o = meta[id] || { id, label: id, group: "", confidence: "", notes: "" };
  card.hidden = false;
  document.getElementById("iTitle").textContent = o.label;
  document.getElementById("iMeta").textContent = `${o.group} · ${o.confidence} confidence`;
  document.getElementById("iNotes").textContent = o.notes || "";
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
  if (!frame) return;
  if (o.entry && mode === "first") {
    walkPos.copy(W2T(...o.entry.eye));
    lookAtYawPitch(W2T(...o.entry.eye), W2T(...o.entry.look));
    placeCamera();
    return;
  }
  if (mode === "first") return;
  const box = new THREE.Box3();
  (groups[id] || []).forEach(m => box.expandByObject(m));
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(4, box.getSize(new THREE.Vector3()).length() * 0.7);
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c);
  camera.position.copy(c.clone().add(dir.multiplyScalar(r)));
  controls.update();
}
window.__select = id => { select(id, true); return document.getElementById("iTitle").textContent; };

function buildList() {
  const list = document.getElementById("list");
  const order = [...new Set(OBJECTS.map(o => o.group))];
  for (const grp of order) {
    const items = OBJECTS.filter(o => o.group === grp && groups[o.id]);
    if (!items.length) continue;
    const h = document.createElement("div"); h.className = "grp"; h.textContent = grp; list.appendChild(h);
    for (const o of items) {
      const b = document.createElement("button");
      b.className = "row"; b.dataset.id = o.id;
      b.innerHTML = `<span class="dot ${o.confidence}" title="${o.confidence} confidence"></span><span class="tx"><span class="lb"></span><span class="id"></span></span>`;
      b.querySelector(".lb").textContent = o.label;
      b.querySelector(".id").textContent = o.sub || "";
      b.addEventListener("click", () => { select(o.id, true); if (innerWidth <= 820) toggleSide(false); });
      b.addEventListener("mouseenter", () => { hovered = o.id; paint(); });
      b.addEventListener("mouseleave", () => { hovered = null; paint(); });
      list.appendChild(b);
    }
  }
}

// ---------------------------------------------------------------- picking + pointer
const ndc = new THREE.Vector2();
function pick(x, y) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.far = Infinity;
  const hits = ray.intersectObjects(meshes, false).filter(h => {
    let p = h.object; while (p) { if (!p.visible) return false; p = p.parent; } return h.object.userData.objId;
  });
  const solid = hits.find(h => !h.object.userData.glass);
  const h = solid || hits[0];
  return h ? h.object.userData.objId : null;
}
window.__pick = (x, y) => { const id = pick(x, y); select(id, false); return id; };
const tip = document.getElementById("tip");
let down = null, last = null;
canvas.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; last = [e.clientX, e.clientY]; if (mode === "first") canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (mode === "first" && down && last) {
    yaw -= (e.clientX - last[0]) * 0.0045;
    pitch = Math.max(-1.3, Math.min(1.3, pitch - (e.clientY - last[1]) * 0.0045));
    last = [e.clientX, e.clientY];
    tip.hidden = true;
    return;
  }
  if (placing) { dropPreview = previewAt(e.clientX, e.clientY); tip.hidden = true; return; }
  if (e.pointerType !== "mouse") return;
  if ((mode !== "first" || thirdPerson) && hitPerson(e.clientX, e.clientY)) {
    tip.textContent = "Click to walk as this person"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false;
    if (hovered) { hovered = null; paint(); }
    return;
  }
  const id = pick(e.clientX, e.clientY);
  if (id !== hovered) { hovered = id; paint(); }
  if (id) { tip.textContent = label(id); tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false; }
  else tip.hidden = true;
});
canvas.addEventListener("pointerleave", () => { hovered = null; paint(); tip.hidden = true; });
canvas.addEventListener("pointerup", e => {
  const wasClick = down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) <= 5;
  down = last = null;
  if (!wasClick) return;
  if (placing) { tryDrop(e.clientX, e.clientY); return; }
  if ((mode !== "first" || thirdPerson) && hitPerson(e.clientX, e.clientY)) { setThird(false); setView("first", { fly: true }); return; }
  select(pick(e.clientX, e.clientY), false);
});

const side = document.getElementById("side"), tog = document.getElementById("toggleSide");
function toggleSide(open) { side.classList.toggle("open", open); tog.setAttribute("aria-expanded", String(open)); }
tog.addEventListener("click", () => toggleSide(!side.classList.contains("open")));

// ---------------------------------------------------------------- minimap
const mini = document.getElementById("miniC"), mctx = mini.getContext("2d");
const plan = new Image();
plan.src = "data:image/jpeg;base64," + MINIMAP;
const M = VIEW.minimap;  // orthographic plan: centre (cx, cy), side S metres
const toMini = (x, y) => [((x - M.cx) / M.S + 0.5) * mini.width, (0.5 - (y - M.cy) / M.S) * mini.height];
const fromMini = (u, v) => [M.cx + (u / mini.width - 0.5) * M.S, M.cy + (0.5 - v / mini.height) * M.S];
function drawMini() {
  mctx.clearRect(0, 0, mini.width, mini.height);
  if (plan.complete) mctx.drawImage(plan, 0, 0, mini.width, mini.height);
  const accent = css().getPropertyValue("--accent").trim() || "#0b6d75";
  if (mode !== "first") {
    const [tu, tv] = toMini(controls.target.x, -controls.target.z);
    mctx.strokeStyle = accent; mctx.lineWidth = 2; mctx.globalAlpha = 0.7;
    mctx.beginPath(); mctx.arc(tu, tv, 9, 0, Math.PI * 2); mctx.stroke(); mctx.globalAlpha = 1;
  }
  const [u, v] = toMini(walkPos.x, -walkPos.z);
  const a = Math.atan2(Math.cos(yaw), -Math.sin(yaw));
  mctx.fillStyle = accent; mctx.globalAlpha = 0.25;
  mctx.beginPath(); mctx.moveTo(u, v); mctx.arc(u, v, 34, -a - 0.55, -a + 0.55); mctx.closePath(); mctx.fill();
  mctx.globalAlpha = 1; mctx.beginPath(); mctx.arc(u, v, 6, 0, Math.PI * 2); mctx.fill();
  mctx.strokeStyle = "#ffffff"; mctx.lineWidth = 2; mctx.stroke();
}
function miniGo(clientX, clientY) {
  const r = mini.getBoundingClientRect();
  const [x, y] = fromMini((clientX - r.left) / r.width * mini.width, (clientY - r.top) / r.height * mini.height);
  const p = W2T(x, y, VIEW.eye);
  if (mode === "first") {
    if (insideWall(p)) return false;
    walkPos.copy(p); placeCamera();
  } else {
    const off = camera.position.clone().sub(controls.target);
    controls.target.copy(W2T(x, y, 0)); camera.position.copy(controls.target.clone().add(off)); controls.update();
  }
  return true;
}
mini.addEventListener("click", e => miniGo(e.clientX, e.clientY));
window.__miniGo = (x, y) => { const r = mini.getBoundingClientRect(); return miniGo(r.left + x * r.width, r.top + y * r.height); };
window.__camera = () => { const p = camera.position; return [p.x, -p.z, p.y]; };
window.__walker = () => [walkPos.x, -walkPos.z, walkPos.y];
window.__teleport = (x, y) => { walkPos.copy(W2T(x, y, VIEW.eye)); placeCamera(); return window.__walker(); };
window.__walk = async (code, ms) => { keys.add(code); await new Promise(r => setTimeout(r, ms)); keys.delete(code); return window.__walker(); };
window.__mode = () => mode;
window.__project = (x, y, z = 0) => { const v = W2T(x, y, z).project(camera), r = canvas.getBoundingClientRect();
  return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; };

// ---------------------------------------------------------------- the person
const person = new THREE.Group();
const pm = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 });
const skinM = pm(0xc49a7a), scrubM = pm(0x2b8a93), darkM = pm(0x24292d), whiteM = pm(0xf1f3f3);
function part(geo, m, x, y, z, parent = person) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o; }
function limb(x, top, r, len, m) {
  const g = new THREE.Group(); g.position.set(x, top, 0);
  part(new THREE.CapsuleGeometry(r, len, 4, 12), m, 0, -(len / 2 + r) + r * 0.6, 0, g);
  person.add(g); return g;
}
const legL = limb(-0.1, 0.92, 0.075, 0.76, scrubM), legR = limb(0.1, 0.92, 0.075, 0.76, scrubM);
for (const lg of [legL, legR]) part(new THREE.BoxGeometry(0.11, 0.07, 0.26), darkM, 0, -0.885, -0.04, lg);
part(new THREE.CapsuleGeometry(0.16, 0.34, 4, 16), scrubM, 0, 1.18, 0).scale.set(1.05, 1, 0.66);
part(new THREE.CylinderGeometry(0.05, 0.055, 0.1, 12), skinM, 0, 1.53, 0);
part(new THREE.SphereGeometry(0.112, 24, 16), skinM, 0, 1.645, 0);
part(new THREE.SphereGeometry(0.118, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), scrubM, 0, 1.655, 0.005);
part(new THREE.BoxGeometry(0.06, 0.085, 0.012), whiteM, 0.075, 1.32, -0.112);  // ID badge marks the front
const armL = limb(-0.215, 1.45, 0.05, 0.46, scrubM), armR = limb(0.215, 1.45, 0.05, 0.46, scrubM);
for (const a of [armL, armR]) part(new THREE.SphereGeometry(0.048, 12, 10), skinM, 0, -0.6, 0, a);
const ringM = new THREE.MeshBasicMaterial({ color: 0x0b6d75, transparent: true, opacity: 0.4, depthWrite: false });
const ring = part(new THREE.CircleGeometry(0.38, 40), ringM, 0, 0.014, 0);
ring.rotation.x = -Math.PI / 2;
scene.add(person);
let phase = 0, moving = 0;
const lastWalk = walkPos.clone();
function updatePerson() {
  const pv = dropPreview, p = pv ? pv.p : walkPos;
  person.position.set(p.x, 0, p.z);
  person.rotation.y = yaw;
  ringM.color.set(pv && !pv.ok ? 0xb4422c : 0x0b6d75);
  person.visible = !!pv || mode !== "first" || thirdPerson || (fly !== null && fly.s < 0.9);
  const d = Math.hypot(walkPos.x - lastWalk.x, walkPos.z - lastWalk.z);
  lastWalk.copy(walkPos);
  moving += ((d > 1e-4 ? 1 : 0) - moving) * 0.2;
  phase += d * 5.2;
  const s = Math.sin(phase) * 0.55 * moving;
  legL.rotation.x = s; legR.rotation.x = -s; armL.rotation.x = -s * 0.7; armR.rotation.x = s * 0.7;
}
function hitPerson(x, y) {
  if (!person.visible) return false;
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); ray.far = Infinity;
  return ray.intersectObject(person, true).some(h => h.object !== ring);
}

// ---------------------------------------------------------------- dropping the person
const dropBtn = document.getElementById("drop"), ghost = document.getElementById("ghost"), helpEl = document.getElementById("help");
let warnTimer = 0, dragDrop = null;
function showHelp() {
  if (warnTimer) return;
  helpEl.innerHTML = placing ? "Click an open spot on the floor to drop the person · <kbd>Esc</kbd> cancels" : HELP[mode];
}
function warn(msg) {
  clearTimeout(warnTimer); helpEl.textContent = msg; helpEl.classList.add("warn");
  warnTimer = setTimeout(() => { warnTimer = 0; helpEl.classList.remove("warn"); showHelp(); }, 3500);
}
function setPlacing(on) {
  placing = on; dropPreview = null;
  document.body.classList.toggle("placing", on);
  dropBtn.setAttribute("aria-pressed", String(on));
  showHelp();
}
function setThird(on) {
  thirdPerson = on;
  const b = document.getElementById("cam3");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? "View from eyes" : "View from behind";
  if (mode === "first" && !fly) placeCamera();
}
document.getElementById("cam3").addEventListener("click", () => setThird(!thirdPerson));
function previewAt(x, y) {
  // where the pointer meets the floor, and whether a person can stand there
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); ray.far = Infinity;
  const o = ray.ray.origin, d = ray.ray.direction;
  if (d.y > -1e-4) return null;
  const p = o.clone().addScaledVector(d, -o.y / d.y);
  const first = ray.intersectObjects(meshes, false).find(h => {
    let q = h.object; while (q) { if (!q.visible) return false; q = q.parent; } return !h.object.userData.glass;
  });
  const overWall = first && colliders.includes(first.object);
  ray.set(new THREE.Vector3(p.x, 0.5, p.z), new THREE.Vector3(0, -1, 0)); ray.far = 0.6;
  const onFloor = ray.intersectObjects(floorMeshes, false).length > 0;
  return { p, ok: onFloor && !overWall && !insideWall(p) };
}
function tryDrop(x, y) {
  const pv = previewAt(x, y);
  setPlacing(false);
  if (!pv || !pv.ok) { warn("That spot is inside a wall or off the floor. Drop the person on open floor."); return false; }
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  if (Math.hypot(dir.x, dir.z) > 0.05) yaw = Math.atan2(-dir.x, -dir.z);
  pitch = 0;
  walkPos.set(pv.p.x, VIEW.eye, pv.p.z); lastWalk.copy(walkPos);
  setThird(false);
  setView("first", { fly: true });
  return true;
}
dropBtn.addEventListener("pointerdown", e => {
  dragDrop = { x: e.clientX, y: e.clientY, moved: false };
  dropBtn.setPointerCapture(e.pointerId); e.preventDefault();
});
dropBtn.addEventListener("pointermove", e => {
  if (!dragDrop) return;
  if (Math.hypot(e.clientX - dragDrop.x, e.clientY - dragDrop.y) > 6) dragDrop.moved = true;
  if (!dragDrop.moved) return;
  ghost.hidden = false; ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  dropPreview = document.elementFromPoint(e.clientX, e.clientY) === canvas ? previewAt(e.clientX, e.clientY) : null;
});
dropBtn.addEventListener("pointerup", e => {
  const d = dragDrop; dragDrop = null; ghost.hidden = true;
  if (!d) return;
  if (!d.moved) { setPlacing(!placing); return; }
  dropPreview = null;
  if (document.elementFromPoint(e.clientX, e.clientY) === canvas) tryDrop(e.clientX, e.clientY);
});
dropBtn.addEventListener("pointercancel", () => { dragDrop = null; ghost.hidden = true; dropPreview = null; });
dropBtn.addEventListener("click", e => { if (e.detail === 0) setPlacing(!placing); });  // keyboard
window.__drop = (x, y) => tryDrop(...window.__project(x, y));

const clock = new THREE.Clock();
if (!GLB_B64) setView("orbit");  // frame the view while the model downloads
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / 1000);
    fly.s = 1 - (1 - k) ** 3;  // ease out, with no overshoot
    camera.position.lerpVectors(fly.p0, fly.p1, fly.s);
    camera.quaternion.slerpQuaternions(fly.q0, fly.q1, fly.s);
    if (k >= 1) { fly = null; placeCamera(); }
  } else if (mode === "first") stepWalk(dt); else controls.update();
  updatePerson();
  renderer.render(scene, camera);
  drawMini();
});
</script>
